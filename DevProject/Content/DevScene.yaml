# DE_ASSET: Scene
# Dev Scene Scene Data
m_SceneObjects:
  -  # Object Data
    m_Object:
      m_Name: 43_Plane
      m_FriendlyName: Plane
# Render Component
    m_RenderComponent:
      m_IsVisible: true
      m_AffectsLighting: true
# Texture Settings
      m_TextureSettings:
        WrapMode: 10497
        WrapValue: 0
        FilterMode: 9729
        FilterValue: 1
      m_Material:
        m_SpecularIntensity: 0.5
        m_SpecularPower: 4
        m_Shader: DefaultShader
        m_BaseParam:
          Color:
            - 1
            - 1
            - 1
          IsTexture: false
# Transform Component
    m_TransformComponent:
      m_Position:
        - 0
        - 0
        - 0
      m_Rotation:
        - 0
        - 0
        - 0
      m_Scale:
        - 1
        - 0.00999999978
        - 1
      m_Moveability: 0
# Physics Component
    m_PhysicsComponent:
      m_SimulatePhysics: false
      m_SimulateGravity: true
      m_ColliderVisible: false
      m_CollisionDetectionEnabled: true
      m_CollisonDimesionOverride: false
