      m_ImpulseEnabled: true
      m_StepMethod: 1
      m_Mass: 1
      m_LinearDrag: 0.5
      m_Elasticity: 0
      m_AngularDrag: 0.5
# Mesh Component
    m_MeshComponent:
      m_Mesh: SM_Plane
